[program:huey]
directory=/srv/my_app
; Run the consumer directly (no shell-script wrappers) so that signals
; are delivered to the Python process. See github issue #88.
; -g TERM makes supervisor's stop signal, TERM, a graceful shutdown.
command=/srv/my_app/venv/bin/huey_consumer my_app.huey -w 4 -k thread -g TERM -t 55
user=appuser
autostart=true
autorestart=true

; SIGKILL deadline (default 10). The consumer's -t 55 interrupts any
; still-running tasks just before this, emitting SIGNAL_INTERRUPTED, so
; nothing is lost to SIGKILL.
stopwaitsecs=60

stdout_logfile=/var/log/huey/stdout.log
stderr_logfile=/var/log/huey/stderr.log
environment=PYTHONUNBUFFERED="1"
